name: Payment and file access regression checks
on:
  push:
    branches: ['feature/ui-polish']
    paths:
      - '.github/workflows/payment-access-checks.yml'
      - 'scripts/test-private-file-access.cjs'
      - 'scripts/test-dispute-fines.cjs'
      - 'src/app/api/evidence/**'
      - 'src/app/api/messages/attachments/**'
      - 'src/app/api/account/profile-image/**'
      - 'src/app/api/admin/disputes/**'
      - 'src/lib/supabase-storage.ts'
      - 'src/lib/cancellation-fees.ts'
      - 'src/lib/dispute-fine-amount.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-access:
    if: github.ref == 'refs/heads/feature/ui-polish'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CHECKPOINT_DISABLE: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - name: Verify private file access and owner-bound profile uploads
        run: node scripts/test-private-file-access.cjs
      - name: Verify dispute fine authorization, amounts and duplicate protection
        run: node scripts/test-dispute-fines.cjs
