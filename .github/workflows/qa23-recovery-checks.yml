name: QA23 bounded payout recovery checks
on:
  push:
    branches: ['feature/ui-polish']
    paths:
      - '.github/workflows/qa23-recovery-checks.yml'
      - 'scripts/test-payout-recovery-probe.cjs'
      - 'scripts/test-native-payout-recovery-probe.cjs'
      - 'scripts/native-payment-rehearsal.cjs'
      - 'src/app/api/admin/payments/payout/route.ts'
      - 'src/app/api/cron/booking-authorisations/route.ts'
      - 'src/lib/stripe-*.ts'
      - 'src/lib/booking-authorisation-recovery.ts'
      - 'src/lib/payment-runtime.ts'
      - 'prisma/schema.prisma'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa23-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-recovery:
    if: github.ref == 'refs/heads/feature/ui-polish'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: ci_only
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: drivedrop_rehearsal_qa23
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U ci_only -d drivedrop_rehearsal_qa23"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      CHECKPOINT_DISABLE: '1'
      VERCEL_ENV: preview
      POSTGRES_PRISMA_URL: postgresql://ci_only:ci_only@127.0.0.1:55432/drivedrop_rehearsal_qa23
      REHEARSAL_DATABASE_URL: postgresql://ci_only:ci_only@127.0.0.1:55432/drivedrop_rehearsal_qa23
      NATIVE_QA23_REPORT: /tmp/drivedrop-native-qa23.json
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked dependencies and disposable schema
        run: |
          npm ci
          node -e "require('./scripts/native-payment-rehearsal.cjs').nativeDatabaseUrl()"
          npx --no-install prisma db push
      - name: Typecheck and offline regression guards
        run: |
          npm run typecheck
          node scripts/test-payout-recovery-probe.cjs
          node scripts/test-stripe-connect.cjs
          node scripts/test-payment-recovery.cjs
          node scripts/test-production-payment-runtime.cjs
      - name: Exercise real PostgreSQL payout preparation and worker
        run: node scripts/test-native-payout-recovery-probe.cjs
      - name: Record bounded evidence
        if: ${{ always() }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = process.env.NATIVE_QA23_REPORT;
          const report = fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, 'utf8')) : {completed: false};
          console.log('QA23_LOCAL_EVIDENCE_BEGIN');
          console.log(JSON.stringify(report, null, 2));
          console.log('QA23_LOCAL_EVIDENCE_END');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'QA23 local verification (offline Stripe)\n\n```json\n' + JSON.stringify(report, null, 2) + '\n```\n');
          NODE
