name: Native production payment rehearsal
on:
  push:
    branches: ['feature/ui-polish']
    paths:
      - '.github/workflows/production-payment-rehearsal.yml'
      - 'scripts/rehearse-production-database.cjs'
      - 'scripts/native-payment-rehearsal.cjs'
      - 'scripts/test-native-payment-recovery.cjs'
      - 'scripts/test-booking-authorisation.cjs'
      - 'scripts/test-production-payment-runtime.cjs'
      - 'scripts/production-database/**'
      - 'scripts/sql/production-schema-baseline.sql'
      - 'scripts/sql/rehearse-production-payment-audit.sql'
      - 'src/lib/booking-authorisation*.ts'
      - 'src/lib/payment-runtime.ts'
      - 'src/lib/availability*.ts'
      - 'src/lib/stripe-*.ts'
      - 'src/lib/alternative-refunds.ts'
      - 'prisma/schema.prisma'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: native-payment-rehearsal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-postgresql:
    if: github.ref == 'refs/heads/feature/ui-polish'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: ci_only
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: drivedrop_rehearsal_payments
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U ci_only -d drivedrop_rehearsal_payments"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      CHECKPOINT_DISABLE: '1'
      VERCEL_ENV: preview
      POSTGRES_PRISMA_URL: postgresql://ci_only:ci_only@127.0.0.1:55432/drivedrop_rehearsal_payments
      REHEARSAL_DATABASE_URL: postgresql://ci_only:ci_only@127.0.0.1:55432/drivedrop_rehearsal_payments
      REHEARSAL_REQUIRE_NATIVE_1711: 'true'
      REHEARSAL_REPORT: /tmp/drivedrop-production-database-rehearsal.json
      NATIVE_RECOVERY_REPORT: /tmp/drivedrop-native-recovery.json
      NATIVE_AUTHORISATION_REPORT: /tmp/drivedrop-native-authorisation.json
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked application dependencies
        run: |
          npm ci
          npx --no-install prisma generate
          psql --version
      - name: Rehearse exact additive schema, audit and permissions
        run: node scripts/rehearse-production-database.cjs
      - name: Compete across native connections and replace an interrupted run
        run: node scripts/test-native-payment-recovery.cjs
      - name: Recover a pending payment and verify booking races
        run: node scripts/test-booking-authorisation.cjs
      - name: Verify production configuration and paused-operation controls
        run: node scripts/test-production-payment-runtime.cjs
      - name: Record bounded evidence in job logs and summary
        if: ${{ always() }}
        run: |
          node <<'NODE'
          const fs = require('node:fs'), {createHash} = require('node:crypto');
          const paths = ['scripts/production-database/supabase/migrations/20261021193022_production_payment_schema.sql',
            'scripts/rehearse-production-database.cjs', 'scripts/native-payment-rehearsal.cjs',
            'scripts/test-native-payment-recovery.cjs', 'scripts/test-booking-authorisation.cjs'];
          const sourceHashes = Object.fromEntries(paths.map(path => [path, createHash('sha256').update(fs.readFileSync(path)).digest('hex')]));
          const reports = Object.fromEntries(['REHEARSAL_REPORT', 'NATIVE_RECOVERY_REPORT', 'NATIVE_AUTHORISATION_REPORT'].map(key =>
            [key, fs.existsSync(process.env[key]) ? JSON.parse(fs.readFileSync(process.env[key], 'utf8')) : {completed: false}]));
          const evidence = {sourceCommit: process.env.GITHUB_SHA, sourceHashes, reports,
            limits: ['Disposable localhost database only; no hosted migration or configuration changed.',
              'Stripe and email use offline fixtures. Provider insufficient-balance, delivery and hosted scheduler gates remain open.']};
          console.log('NATIVE_REHEARSAL_EVIDENCE_BEGIN');
          console.log(JSON.stringify(evidence, null, 2));
          console.log('NATIVE_REHEARSAL_EVIDENCE_END');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Native PostgreSQL payment rehearsal\n\n```json\n' + JSON.stringify(evidence, null, 2) + '\n```\n');
          NODE
