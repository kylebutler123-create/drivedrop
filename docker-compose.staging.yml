services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: drivedrop_staging
      POSTGRES_USER: drivedrop
      POSTGRES_PASSWORD: drivedrop_staging_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drivedrop -d drivedrop_staging"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - drivedrop_staging_pg:/var/lib/postgresql/data
volumes:
  drivedrop_staging_pg:
